<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Emergency Blood Prediction System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .form-section {
            width: 100%;
            max-width: 550px;
            margin: 2rem auto;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #e63946;
            color: #e63946;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="form-section">
        <div class="form-header">
            <div class="form-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <h1 class="form-title">Join Our Network</h1>
            <p class="form-subtitle">Register to access emergency blood services</p>
        </div>

        <div id="message" class="alert"></div>

        <form id="register-form">
            <div class="form-grid two-columns">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i> Username <span class="required">*</span>
                    </label>
                    <input type="text" class="form-input" id="username" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-phone"></i> Phone <span class="required">*</span>
                    </label>
                    <input type="tel" class="form-input" id="phone" placeholder="Enter your phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-envelope"></i> Email <span class="required">*</span>
                </label>
                <input type="email" class="form-input" id="email" placeholder="Enter your email address" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i> Password <span class="required">*</span>
                </label>
                <input type="password" class="form-input" id="password" placeholder="Create a strong password" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-map-marker-alt"></i> Address <span class="required">*</span>
                </label>
                <input type="text" class="form-input" id="address" placeholder="Enter your full address" required>
            </div>

            <div class="form-grid two-columns">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-city"></i> City <span class="required">*</span>
                    </label>
                    <input type="text" class="form-input" id="city" placeholder="Enter your city" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-map-pin"></i> Pincode <span class="required">*</span>
                    </label>
                    <input type="text" class="form-input" id="pincode" placeholder="Enter your pincode" required>
                </div>
            </div>

            <div class="form-checkbox-container">
                <input type="checkbox" class="form-checkbox" id="is_donor">
                <label for="is_donor">I want to be a blood donor and help save lives</label>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </div>
        </form>

        <div class="text-center" style="margin-top: 1.5rem;">
            <p style="color: #94a3b8;">Already have an account? 
                <a href="{{ url_for('auth.login') }}" style="color: #e63946; text-decoration: none; font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                pincode: document.getElementById('pincode').value,
                is_donor: document.getElementById('is_donor').checked
            };
            
            try {
                const response = await fetch('{{ url_for("auth.register") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Registration successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '{{ url_for("main.dashboard") }}';
                    }, 2000);
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Registration failed. Please try again.', 'error');
            }
        });
        
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
